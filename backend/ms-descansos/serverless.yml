service: ms-descansos

frameworkVersion: "4"

plugins:
  - serverless-step-functions

provider:
  name: aws
  runtime: python3.14
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 29
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  environment:
    TABLE_DESCANSOS: ${self:service}-${sls:stage}-descansos
    TABLE_SOLICITUDES: ${self:service}-${sls:stage}-solicitudes
    BUCKET_DESCANSOS: ${self:service}-${sls:stage}-bucket-${aws:accountId}
    GROQ_API_KEY: ${env:GROQ_API_KEY}
    GROQ_MODEL: llama-3.3-70b-versatile
    SENDGRID_API_KEY: ${env:SENDGRID_API_KEY}
    SENDGRID_FROM_EMAIL: ${env:SENDGRID_FROM_EMAIL}
    STATE_MACHINE_ARN: arn:aws:states:${aws:region}:${aws:accountId}:stateMachine:${self:service}-${sls:stage}-workflow

functions:
  # ----- Endpoint API que arranca el workflow -----
  start_workflow:
    handler: lambdas/start_workflow.handler
    events:
      - http:
          path: /descansos/workflow
          method: post
          cors: true

  status_workflow:
    handler: lambdas/start_workflow.status
    events:
      - http:
          path: /descansos/workflow/{executionArn+}
          method: get
          cors: true

  agente_ia:
    handler: lambdas/agente_ia.handler
    events:
      - http:
          path: /agente-ia/descansos
          method: post
          cors: true

  upload_url:
    handler: lambdas/upload_url.handler
    timeout: 60
    events:
      - http:
          path: /descansos/upload-url
          method: post
          cors: true

  # ----- Lambdas internas del workflow -----
  list_files:
    handler: lambdas/list_files.handler
    timeout: 60

  process_file:
    handler: lambdas/process_file.handler
    timeout: 300

  generate_csv:
    handler: lambdas/generate_csv.handler
    timeout: 60

  send_email:
    handler: lambdas/send_email.handler
    timeout: 60

  # ----- Endpoints CRUD + aprobación de Solicitudes de Descanso Médico -----
  solicitudes_listar:
    handler: lambdas/solicitudes.listar
    events:
      - http: { path: /descansos/solicitudes, method: get, cors: true }

  solicitudes_obtener:
    handler: lambdas/solicitudes.obtener
    events:
      - http: { path: "/descansos/solicitudes/{id}", method: get, cors: true }

  solicitudes_crear:
    handler: lambdas/solicitudes.crear
    events:
      - http: { path: /descansos/solicitudes, method: post, cors: true }

  solicitudes_aprobar:
    handler: lambdas/solicitudes.aprobar
    events:
      - http: { path: "/descansos/solicitudes/{id}/aprobar", method: put, cors: true }

  solicitudes_rechazar:
    handler: lambdas/solicitudes.rechazar
    events:
      - http: { path: "/descansos/solicitudes/{id}/rechazar", method: put, cors: true }

  solicitudes_exportar_csv:
    handler: lambdas/solicitudes.exportar_csv
    events:
      - http: { path: /descansos/solicitudes/exportar, method: get, cors: true }

  # ----- Listado y descarga de CSVs de resultados del workflow IA -----
  resultados_listar:
    handler: lambdas/resultados.listar
    events:
      - http: { path: /descansos/resultados, method: get, cors: true }

  resultados_descargar:
    handler: lambdas/resultados.descargar
    events:
      - http: { path: "/descansos/resultados/download/{key+}", method: get, cors: true }

stepFunctions:
  stateMachines:
    workflowDescansos:
      name: ms-descansos-${sls:stage}-workflow
      role: arn:aws:iam::${aws:accountId}:role/LabRole
      definition:
        Comment: Workflow procesamiento descansos médicos con IA
        StartAt: ListFiles
        States:
          ListFiles:
            Type: Task
            Resource: arn:aws:lambda:${aws:region}:${aws:accountId}:function:${self:service}-${sls:stage}-list_files
            ResultPath: $.listing
            Next: ProcessAll
          ProcessAll:
            Type: Map
            ItemsPath: $.listing.files
            MaxConcurrency: 5
            Parameters:
              file.$: $$.Map.Item.Value
              instrucciones_s3.$: $.instrucciones_s3
              email.$: $.email
              execution_id.$: $.execution_id
            Iterator:
              StartAt: ProcessFile
              States:
                ProcessFile:
                  Type: Task
                  Resource: arn:aws:lambda:${aws:region}:${aws:accountId}:function:${self:service}-${sls:stage}-process_file
                  Retry:
                    - ErrorEquals: [States.ALL]
                      IntervalSeconds: 3
                      MaxAttempts: 2
                      BackoffRate: 2.0
                  End: true
            ResultPath: $.results
            Next: GenerateCsv
          GenerateCsv:
            Type: Task
            Resource: arn:aws:lambda:${aws:region}:${aws:accountId}:function:${self:service}-${sls:stage}-generate_csv
            ResultPath: $.csv
            Next: SendEmail
          SendEmail:
            Type: Task
            Resource: arn:aws:lambda:${aws:region}:${aws:accountId}:function:${self:service}-${sls:stage}-send_email
            End: true

resources:
  Resources:
    DescansosTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_DESCANSOS}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: execution_id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: execution_id-index
            KeySchema:
              - AttributeName: execution_id
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    SolicitudesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_SOLICITUDES}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: estado
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: estado-index
            KeySchema:
              - AttributeName: estado
                KeyType: HASH
            Projection:
              ProjectionType: ALL

    DescansosBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:provider.environment.BUCKET_DESCANSOS}
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ["*"]
              AllowedMethods: [GET, PUT, POST, HEAD]
              AllowedOrigins: ["*"]
