service: ms-conductores

frameworkVersion: "4"

provider:
  name: aws
  runtime: python3.13
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 512
  timeout: 29
  iam:
    role: arn:aws:iam::${aws:accountId}:role/LabRole
  environment:
    TABLE_CONDUCTORES: ${self:service}-${sls:stage}-conductores

functions:
  listar:
    handler: handler.listar
    events:
      - http: { path: /conductores, method: get, cors: true }

  crear:
    handler: handler.crear
    events:
      - http: { path: /conductores, method: post, cors: true }

  obtener:
    handler: handler.obtener
    events:
      - http: { path: /conductores/{id}, method: get, cors: true }

  actualizar:
    handler: handler.actualizar
    events:
      - http: { path: /conductores/{id}, method: put, cors: true }

  eliminar:
    handler: handler.eliminar
    events:
      - http: { path: /conductores/{id}, method: delete, cors: true }

  disponibles:
    handler: handler.disponibles
    events:
      - http: { path: /conductores/disponibles, method: get, cors: true }

resources:
  Resources:
    ConductoresTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:provider.environment.TABLE_CONDUCTORES}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
